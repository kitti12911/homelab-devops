hw_board: "x86-64"
hw_os: "Ubuntu"
hw_cpu_cores: 2
hw_ram_gb: 8
hw_storage_primary: "SATA SSD (OS)"
hw_storage_type: "sata_ssd"
hw_storage_secondary: "2x 1.8TB HDD (NAS data)"
hw_network: "1Gbps Ethernet"

# --- Node role ---
k8s_node: false # not a cluster member
container_host: false # no container runtime; excluded from setup-podman.yml

# --- NAS data disks ---
# Both data disks are USB-attached, not SATA, and carry ext4 filesystems written by
# an earlier OpenMediaVault install. They are deliberately left as ext4: USB-SATA
# bridges misreport write barriers, so ZFS would claim integrity guarantees it could
# not actually keep.
#
# setup-nas-shares.yml mounts only what is listed here, keyed by filesystem UUID -
# stable across reboots, USB port changes and enclosure swaps, unlike sdX. Nothing
# is mounted on a guess: an attached disk that is absent from both lists is reported
# with the commands to inspect it by hand, and otherwise left alone.
#
# Roles identified 2026-08-01 after the disks had sat idle for over a year. Both are
# 1.8TB ext4; sdb1/sdc1 are not recorded here on purpose, since USB enumeration order
# is not stable and the UUID is what the mount actually keys on.
nas_active_disks:
    - uuid: 05b4cf97-5f3c-4ff4-ad51-27b44acc32b5 # label RuntimeDrive
      name: active

nas_backup_disks:
    - uuid: 1c1d3039-ab5c-4363-a8f4-774beb243808 # unlabelled
      name: backup

# While true every listed disk is mounted read-write and shared, so old data can be
# cleared out over SMB from the Mac. Set false once that is done and the backup disk
# reverts to read-only, noauto and unshared, so it stays spun down between syncs.
nas_cleanup: false

# --- Weekly backup ---
# Folders under the active disk mirrored onto the backup disk every Sunday at 03:00
# by nas-backup.timer. Paths are relative to /srv/nas/active.
#
# The sync is additive: rsync runs without --delete, so removing a file over SMB
# leaves it on the backup disk and an accidental delete stays recoverable. The cost
# is drift - a rename leaves both the old and the new copy, and the disk only ever
# grows - so `sudo nas-backup status` prints active-vs-backup sizes per folder, and
# reclaiming space means deleting from the backup disk by hand.
#
# Each folder named here is created on the active disk by setup-nas-shares.yml if it
# does not exist yet, with the share group and setgid bit already set, so it appears
# on the SMB share ready to drop files into. Creation is skipped when the active disk
# is unmounted, since that would write to the OS SSD under the mount point.
nas_backup_paths:
    - Document
    - Media

hw_note: |
    Standalone NAS — the only x86 host, so it does not share the Raspberry Pi
    playbooks (config.txt / cmdline.txt / Pi overlays do not apply).

    Provision with:
      ansible-playbook playbooks/infrastructure/setup-nas.yml        # OS tuning
      ansible-playbook playbooks/infrastructure/setup-nas-shares.yml # mounts + SMB

    Tuned for throughput and page-cache retention rather than latency; zram is a
    safety valve at ram/4 with lz4, since compression competes for only 2 cores.
